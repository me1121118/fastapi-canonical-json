[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-canonical-json"
version = "0.1.0"
description = "Deterministic RFC 8785 Canonical JSON serializer and response class for FastAPI and cryptographic signatures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "me1121118" }
]
keywords = ["fastapi", "python", "utility", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["fastapi>=0.100.0", "starlette>=0.27.0"]

[project.urls]
Homepage = "https://github.com/me1121118/fastapi-canonical-json"
Repository = "https://github.com/me1121118/fastapi-canonical-json"
